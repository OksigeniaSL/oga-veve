<!doctype html>
<html lang="es-PY">
  <head>
    <!--
      **El vigilante del arranque.** Si el juego no llega a empezar, la página
      se quedaba quieta para siempre y sin decir nada. Se vio en los bancos:
      Chrome corta las peticiones en curso cuando cambia la red del equipo
      —«net::ERR_NETWORK_CHANGED»—, y si en ese momento se estaba bajando un
      módulo, la importación entera falla y el juego no arranca. En un móvil
      que pasa de wifi a datos mientras carga, eso le pasa a un niño de verdad.

      Va aquí y no en el juego porque es justo lo que no llega a cargarse. La
      primera vez recarga solo —casi siempre basta— y, si vuelve a fallar,
      enseña un botón grande con la flecha de volver a cargar, que se entiende
      sin leer. No cuenta nada a nadie: no hay a quién.
    -->
    <script>
      (function () {
        var CLAVE = "oga-veve:reintento";
        var puesto = false;
        function boton() {
          if (puesto || window.__ogaVivo || !document.body) return;
          puesto = true;
          var en = (navigator.language || "").indexOf("en") === 0;
          var caja = document.createElement("div");
          caja.setAttribute("role", "alert");
          caja.style.cssText =
            "position:fixed;inset:0;display:grid;place-content:center;" +
            "justify-items:center;gap:14px;background:#12201a;color:#e4e2da;" +
            "font:600 20px system-ui,sans-serif;z-index:99";
          caja.innerHTML =
            '<button type="button" aria-label="' +
            (en ? "Load again" : "Volver a cargar") +
            '" style="width:112px;height:112px;border-radius:50%;border:0;' +
            'background:#c96a3c;cursor:pointer;display:grid;place-items:center">' +
            '<svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">' +
            '<path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" ' +
            'd="M19 12a7 7 0 1 1-2.05-4.95"/><path fill="#fff" d="M20 3v6h-6z"/></svg>' +
            "</button><span>" +
            (en ? "Load again" : "Volver a cargar") +
            "</span>";
          caja.querySelector("button").onclick = function () {
            location.reload();
          };
          document.body.appendChild(caja);
        }
        window.__ogaFallo = function () {
          var ya = null;
          try {
            ya = sessionStorage.getItem(CLAVE);
          } catch (e) {}
          if (!ya) {
            try {
              sessionStorage.setItem(CLAVE, "1");
            } catch (e) {}
            location.reload();
          } else boton();
        };
        /*
         * El error del script del juego, cogido en `window` y en captura: el
         * `onerror` en la etiqueta lo quita Vite al construir. Un módulo que
         * no baja —él o cualquiera de los que importa— da error en su
         * etiqueta, y los errores de etiqueta no suben: por eso en captura.
         */
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t.tagName === "SCRIPT" && t.type === "module")
              window.__ogaFallo();
          },
          true,
        );
        setTimeout(boton, 90000);
      })();
    </script>
    <meta charset="utf-8" />
    <!--
      Sin `user-scalable=no`: bloquear el zoom incumple el criterio 1.4.4 de
      WCAG y deja fuera a quien necesita agrandar. El juego usa `touch-action:
      none` sobre los mandos, que ya evita el zoom accidental al pilotar sin
      quitárselo a quien lo necesita.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2F5243" />
    <meta
      name="description"
      content="Simulador de vuelo gratis en el navegador, sin instalar y sin registrarte. Volá sobre aeródromos reales de Paraguay y de Canarias. Desde los 4 años."
    />
    <title>Óga Veve — Volá sobre Paraguay y Canarias</title>
    <!--
      **Dónde vive esto, dicho para los buscadores.**

      Google no lo encontraba: «Google no reconoce esta URL», sin mapa del
      sitio que la nombrase ni página que la enlazase. La dirección buena es
      con barra al final —sin ella las rutas relativas del juego no
      resuelven—, y la misma página se sirve también en juego.granjaoga.com y
      sin la barra: la canónica dice cuál es la de verdad.

      Y una sola página para los tres idiomas: el juego elige el del
      navegador al arrancar, sin dirección propia por idioma. Las `hreflang`
      dicen eso, que esta misma dirección sirve castellano, inglés y guaraní,
      para que no se tome por una página solo en castellano.

      El `robots.txt` y el `sitemap.xml` de esta carpeta no los lee nadie:
      un buscador solo mira el `robots.txt` de la raíz del dominio. El mapa
      del sitio que cuenta es el de granjaoga.com, y es allí donde se nombra
      esta página. Ver `public/robots.txt`.
    -->
    <link rel="canonical" href="https://granjaoga.com/oga-veve/" />
    <link rel="alternate" hreflang="es" href="https://granjaoga.com/oga-veve/" />
    <link rel="alternate" hreflang="en" href="https://granjaoga.com/oga-veve/" />
    <link rel="alternate" hreflang="gn" href="https://granjaoga.com/oga-veve/" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://granjaoga.com/oga-veve/"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!--
      Y el manifiesto, que es lo que convierte esto en algo instalable.

      `display: fullscreen` y `orientation: landscape` no son adornos: en un
      teléfono apaisado la barra del navegador se come un tercio del alto, y
      el juego abierto desde su icono no lleva ni esa barra ni la de estado.
      En la tablet del aula, además, sin barra no se toca nada por error. Y
      volar de pie no tiene sentido con la pantalla partida en tres columnas.
      Donde no hay pantalla completa, el navegador cae solo a `standalone`.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icono-192.png" />
    <!--
      **Y el iPhone, que no lee el manifiesto para esto.** Safari no deja que
      una página pida la pantalla completa —ver `ui/pantalla-completa.ts`—, y
      lo único que la da es añadirla a la pantalla de inicio. Estas tres son
      las que hacen que desde ese icono se abra sin barra ninguna, con la
      barra de estado transparente sobre el juego y con su nombre debajo.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Óga Veve" />

    <!--
      **Cómo se ve este enlace cuando alguien lo comparte.**

      En Paraguay esto se va a compartir por WhatsApp, y un enlace sin tarjeta
      es un enlace que nadie abre. Las direcciones van absolutas a propósito:
      quien lee estas etiquetas es un servidor ajeno, no un navegador, y una
      ruta relativa no le sirve de nada.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Óga Veve" />
    <meta property="og:locale" content="es_PY" />
    <meta
      property="og:title"
      content="Óga Veve — Volá sobre Paraguay y Canarias"
    />
    <meta
      property="og:description"
      content="Simulador de vuelo gratis, en el navegador y sin instalar. Se vuela sobre aeródromos reales de Paraguay y de Canarias, con relieve medido. Gratis para siempre para la educación paraguaya."
    />
    <!--
      **Y ya con dirección**, la de granjaoga.com, donde se juega desde el 19
      de septiembre de 2026. Las dos absolutas —la página y la imagen—, que es
      lo que piden los buscadores y las redes; una a medias es peor que
      ninguna, y `src/meta.test.ts` lo vigila.
    -->
    <meta property="og:url" content="https://granjaoga.com/oga-veve/" />
    <meta property="og:image" content="https://granjaoga.com/oga-veve/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Una avioneta sobre lomas verdes, con el nombre Óga Veve"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Y lo mismo para quien no es una persona: `llms.txt` cuenta qué es esto y
      para quién, y este JSON-LD lo dice en el vocabulario que entienden los
      buscadores. `isAccessibleForFree` no es una etiqueta de marketing: es la
      promesa del proyecto, escrita donde una máquina la puede leer. Y lo de
      «sin registro y sin datos personales», que schema.org no tiene con qué
      decirlo, va en la descripción y en la lista de lo que trae.

      Son dos nodos porque son dos cosas con dos licencias: el juego —su arte,
      sus voces, sus marcas— no es Apache-2.0, ver LICENSE-CONTENIDO.md; el
      código sí, y es el que tiene repositorio. Pasado por el vocabulario de
      schema.org entero, tipo por tipo y propiedad por propiedad.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "VideoGame",
            "@id": "https://granjaoga.com/oga-veve/#juego",
            "name": "Óga Veve",
            "alternateName": "Oga Veve",
            "url": "https://granjaoga.com/oga-veve/",
            "image": "https://granjaoga.com/oga-veve/og.png",
            "description": "Simulador de vuelo gratis para el navegador, sobre aeródromos reales de Paraguay y de Canarias con relieve medido. Sin instalar, sin registro y sin datos personales. Cuatro peldaños, del que no sabe leer al que lee instrumentos.",
            "inLanguage": ["es-PY", "en", "gn"],
            "isAccessibleForFree": true,
            "isFamilyFriendly": true,
            "typicalAgeRange": "4-",
            "audience": { "@type": "PeopleAudience", "suggestedMinAge": 4 },
            "genre": ["Simulation", "Educational"],
            "playMode": "SinglePlayer",
            "gamePlatform": "Web browser",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "featureList": [
              "Gratis y sin instalar: se juega en el navegador",
              "Sin registro ni cuentas: no pide nombre, correo ni contraseña",
              "Sin datos personales ni analítica: lo que se guarda queda en el navegador",
              "Se juega sin saber leer: dibujos, colores y voz",
              "Funciona sin conexión a partir de la segunda visita",
              "Aeródromos reales de Paraguay y de Canarias, con relieve medido"
            ],
            "spatialCoverage": [
              { "@type": "Country", "name": "Paraguay" },
              { "@type": "AdministrativeArea", "name": "Canarias" }
            ],
            "author": {
              "@type": "Organization",
              "name": "Oksigenia SL",
              "url": "https://oksigenia.com"
            },
            "publisher": {
              "@type": "Organization",
              "name": "Oksigenia SL",
              "url": "https://oksigenia.com",
              "brand": {
                "@type": "Brand",
                "name": "Granja Óga",
                "url": "https://granjaoga.com/"
              }
            },
            "license": "https://github.com/OksigeniaSL/oga-veve/blob/main/LICENSE-CONTENIDO.md",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "PYG",
              "availability": "https://schema.org/InStock"
            }
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "Óga Veve",
            "codeRepository": "https://github.com/OksigeniaSL/oga-veve",
            "programmingLanguage": "TypeScript",
            "license": "https://www.apache.org/licenses/LICENSE-2.0",
            "targetProduct": { "@id": "https://granjaoga.com/oga-veve/#juego" }
          }
        ]
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <!--
      El HUD NO es una región viva. Sus cifras cambian sesenta veces por
      segundo y un lector de pantalla las anunciaría sin parar: es peor que no
      tener nada. Las regiones vivas están dentro, acotadas a los avisos y a
      los mensajes efímeros.
    -->
    <!--
      El cristal de las gafas de sol. Va **entre el lienzo y el HUD** a
      propósito: unas gafas se llevan mirando por la ventanilla, y los
      instrumentos están a la sombra del salpicadero. Ver `flight/gafas.ts`.
    -->
    <div id="cristal" class="cristal" aria-hidden="true"></div>
    <div id="hud" class="hud"></div>

    <!--
      Mandos táctiles. Se ocultan por CSS cuando el puntero es fino (ratón),
      no por detección de "es móvil": un portátil con pantalla táctil tiene
      que poder usar los dos.
    -->
    <!--
      Y cada mando lleva dibujado lo que hace. Eran tres círculos grises
      idénticos con un punto ocre y un botón con la palabra «Frenos» escrita
      a pelo en castellano: en el aparato del aula, y para un público que no
      lee, tres mandos iguales y una palabra no dicen absolutamente nada.

      Los dibujos son los mismos que ya usa el juego en otras pantallas, para
      que se reconozcan: la silueta del avión de la señal, el motor de las
      teclas del gas —hélice o reactor, según el avión; lo pone game.ts— y
      los dos pedales del timón, que es lo que mueve un
      timón de verdad.

      El botón de freno se fue: había dos a la vez —este y la mano roja del
      HUD, que sale en los peldaños sin letras— y de los dos ganaba la mano.
      Queda la mano, que además es un dibujo y no una palabra.
    -->
    <!--
      Y cada uno lleva `role="group"` y el nombre de lo que mueve.

      Sin papel, un `aria-label` colgado de un `div` no lo lee casi ningún
      lector de pantalla: el nombre estaba puesto y no contaba —criterio
      4.1.2—. Y `data-equivale-a` no es decoración: dice **con qué teclas se
      hace lo mismo**, que es lo que permite que estos tres no estén en el
      recorrido del tabulador sin que eso sea un agujero. Meterlos añadiría
      tres paradas que con teclado no hacen nada, y lo que de verdad pilota
      desde el teclado son las flechas. `scripts/verificar-acceso.mjs` exige
      que todo mando visible esté en el tabulador **o** declare aquí su
      equivalente, y lo comprueba contra el mapa de teclas de verdad.
    -->
    <div id="tactil" class="tactil">
      <div
        class="pad pad--stick"
        data-touch="stick"
        role="group"
        data-equivale-a="pitchUp pitchDown rollLeft rollRight"
        data-i18n-label="tactil.palanca"
      >
        <svg class="pad__dibujo" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2.6 L13.4 9.4 L22 12.6 v1.8 l-8.6-1.6 v4.4 l2.6 2 v1.4
                   L12 19.6 L7.9 20.6 v-1.4 l2.6-2 v-4.4 L2 14.4 v-1.8 l8.6-3.2 Z"
          />
        </svg>
        <span class="pad__punto"></span>
      </div>
      <div
        class="pad pad--rudder"
        data-touch="rudder"
        role="group"
        data-equivale-a="yawLeft yawRight"
        data-i18n-label="tactil.timon"
      >
        <svg
          class="pad__dibujo pad__dibujo--ancho"
          viewBox="0 0 48 24"
          aria-hidden="true"
        >
          <rect x="6" y="4" width="13" height="16" rx="3" />
          <rect x="29" y="4" width="13" height="16" rx="3" />
          <path
            d="M6 12 h13 M29 12 h13"
            stroke="rgba(18,26,22,0.55)"
            stroke-width="2"
            fill="none"
          />
        </svg>
        <span class="pad__punto"></span>
      </div>
      <div
        class="pad pad--throttle"
        data-touch="throttle"
        role="group"
        data-equivale-a="throttleUp throttleDown"
        data-i18n-label="tactil.motor"
      >
        <svg
          class="pad__dibujo pad__dibujo--alto"
          viewBox="0 0 24 60"
          aria-hidden="true"
        >
          <ellipse cx="12" cy="6.5" rx="2.4" ry="6" />
          <ellipse cx="12" cy="19.5" rx="2.4" ry="6" />
          <ellipse cx="5.2" cy="13" rx="6" ry="2.4" />
          <ellipse cx="18.8" cy="13" rx="6" ry="2.4" />
          <ellipse cx="12" cy="45" rx="1.3" ry="3.4" />
          <ellipse cx="12" cy="52" rx="1.3" ry="3.4" />
          <ellipse cx="8.4" cy="48.5" rx="3.4" ry="1.3" />
          <ellipse cx="15.6" cy="48.5" rx="3.4" ry="1.3" />
        </svg>
        <!--
          Y la palanca enseña dónde está: el punto recorre la palanca entera
          —antes se movía once píxeles en ciento noventa—, el color llena
          desde el ralentí hasta él, y tres muescas marcan ralentí, rodaje y
          despegue. Ver src/flight/palanca-de-gas.ts.
        -->
        <span class="gas__relleno" aria-hidden="true"></span>
        <span class="gas__marca gas__marca--despegue" aria-hidden="true"></span>
        <span class="gas__marca gas__marca--rodaje" aria-hidden="true"></span>
        <span class="gas__marca gas__marca--ralenti" aria-hidden="true"></span>
        <span class="pad__punto"></span>
      </div>
    </div>

    <!--
      El hangar: la pantalla de elegir a dónde y con quién. Va antes que nada
      y por eso está aquí y no dentro del HUD, que es de vuelo.
    -->
    <!--
      Los pilotos: doce huecos y un avión en cada uno. Va antes que el hangar
      porque lo primero no es dónde volar, es quién vuela.
    -->
    <div id="pilotos" class="pilotos" hidden></div>

    <div id="hangar" class="hangar" hidden></div>

    <!--
      El menú de pausa. Va fuera del HUD porque el HUD se rehace entero al
      cambiar de idioma o de peldaño, y esto tiene que poder estar abierto
      mientras eso pasa.
    -->
    <div id="pausa" class="pausa" hidden></div>
    <!-- Y los ajustes, que se abren desde la pausa. -->
    <div id="ajustes" class="ajustes" hidden></div>

    <!--
      El esquema de cómo vuela un ala. Va aparte de los créditos porque no es
      un panel de leer: tiene un tirador y un dibujo que responde.
    -->
    <!-- Qué hay que hacer en esta misión. Ver src/ui/pantalla-mision.ts. -->
    <div id="mision" class="mision" hidden></div>
    <div id="ala" class="ala" hidden></div>
    <div id="creditos" class="creditos" hidden></div>
    <div id="teclas" class="creditos teclas" hidden></div>
    <!--
      El cuaderno de vuelo: las horas, lo hecho y el grado que sale de ahí.
      Comparte la caja de los créditos porque es lo mismo —un panel que se
      abre encima del vuelo y se cierra— y lo que cambia es lo de dentro.
    -->
    <div id="cuaderno" class="creditos cuaderno" hidden></div>

    <!--
      **Y qué es esto, para quien no ejecuta el juego.** Sin JavaScript no
      arranca nada y la página era un lienzo negro con una línea: así la ven
      los buscadores y los modelos que no ejecutan código, y quien tenga el
      JavaScript apagado. Encima de todo y con su propio estilo, porque la
      hoja del juego deja el cuerpo sin desplazamiento y sin selección.
    -->
    <noscript>
      <main
        style="position:fixed;inset:0;z-index:100;overflow:auto;background:#12201a;color:#e4e2da;font:17px/1.55 system-ui,sans-serif;padding:24px 16px;user-select:text"
      >
        <div style="max-width:40rem;margin:0 auto">
          <h1 style="font-size:30px;margin:0 0 4px">Óga Veve</h1>
          <p style="margin:0 0 18px;color:#c9c5b6">
            Volá sobre Paraguay y Canarias
          </p>
          <p>
            Un simulador de vuelo para el navegador, gratis y sin instalar.
            Volá sobre aeródromos reales de Paraguay —Silvio Pettirossi,
            Guaraní, Encarnación, Pedro Juan Caballero, el Chaco— y sobre los
            ocho aeropuertos de Canarias, con el relieve medido.
          </p>
          <p>
            Es para chicos y chicas desde los cuatro años, antes de saber leer,
            y para grandes que quieran volar sin leerse un manual. No pide
            registro ni datos personales: lo que se guarda queda en tu
            navegador.
          </p>
          <p><strong>Para jugar, activá JavaScript en el navegador.</strong></p>
          <p lang="en" style="color:#c9c5b6">
            Óga Veve is a free browser flight simulator over real airfields in
            Paraguay and the Canary Islands, for children from age four. No
            sign-up and no personal data. JavaScript is required to play.
          </p>
          <p style="font-size:15px;color:#c9c5b6">
            Un producto de Oksigenia SL bajo la marca
            <a href="https://granjaoga.com/" style="color:#f2b96e">Granja Óga</a>
            ·
            <a
              href="https://github.com/OksigeniaSL/oga-veve"
              style="color:#f2b96e"
              >código abierto</a
            >
          </p>
        </div>
      </main>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
