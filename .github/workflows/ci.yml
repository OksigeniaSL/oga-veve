# CI de Óga Veve.
#
# **En cada push y en cada propuesta, solo los cerrojos**: que ningún commit
# acredite una herramienta y que no se suba un secreto. Son segundos, y son lo
# que no se puede dejar para luego: un secreto subido ya está publicado.
#
# **Tipos, tests y build, solo con una etiqueta de versión o a mano**
# (`workflow_dispatch`), una vez por tanda cerrada. Antes de cada push se pasan
# en el portátil, que tarda menos y no hace esperar a nadie, y solo se sube en
# verde: GitHub queda como la confirmación del final, no como el sitio donde se
# descubren los fallos. En cada push eran de quince a treinta y cinco minutos
# de GitHub (noviembre de 2026) para confirmar lo que el portátil ya sabía.
#
# Node 20 es el mínimo declarado en `package.json` y 22 el más alto que se
# prueba: los dos, porque ahora esto corre poco y es donde una regresión de
# runtime hay que cazarla.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# **Una tanda por rama, y gana la última.**
#
# El despliegue ya lo hacía y CI no, y eso se ve en el calendario: noventa y
# cuatro tandas en un solo día, doce de septiembre. Se trabaja a ráfagas de
# commits seguidos, así que la mitad de esas tandas estaban comprobando un
# commit que ya no era la punta de la rama cuando terminaron. Lo que importa
# es que la punta esté verde.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **Y que la historia no acredite a ninguna herramienta.**
  #
  # El gancho de `.githooks/commit-msg` ataja esto antes de que el commit
  # exista, que es donde hay que atajarlo. Esto de aquí es el cerrojo de
  # detrás: un `--no-verify`, un clon sin `npm install`, o una reescritura que
  # vuelva a meter lo que se acaba de sacar.
  #
  # Mira la historia **entera** y no solo lo que llega nuevo, a propósito: lo
  # que se quiere garantizar no es que este push venga limpio, es que el
  # repositorio lo esté. Se paga con un clon completo, y por eso este trabajo
  # no instala nada ni compila nada — son unos segundos y va en paralelo con
  # el que sí trabaja.
  atribucion:
    name: Sin acreditar herramientas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con la historia entera
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ningún commit acredita una herramienta
        run: |
          # `--grep` busca en el mensaje entero —asunto y cuerpo— y devuelve
          # **qué commit**, que es lo que hace falta para arreglarlo. Un grep
          # sobre la salida daría el número de línea de un río de texto.
          sucios=$(git log --all --extended-regexp --regexp-ignore-case \
            --grep='(<noreply@anthropic\.com>|^Claude-Session:|^Co-Authored-By:.*\bClaude\b|Generated with \[|claude\.ai/code/)' \
            --format='  %h %s')
          if [ -n "$sucios" ]; then
            echo "✗ Estos commits acreditan una herramienta:"
            echo "$sucios"
            echo ""
            echo "Ver AGENTS.md, apartado «Publicación»."
            exit 1
          fi
          echo "✓ historia limpia"

  # **Que no se suba un secreto.** La historia entera, por lo mismo que la
  # atribución: lo que se quiere garantizar es que el repositorio esté limpio,
  # no solo lo que llega. La versión, fijada y comprobada contra su suma, que va
  # escrita aquí y no se baja del mismo sitio que el programa; es la misma que se
  # pasa en el portátil. Lo que señala y no es un secreto, en `.gitleaksignore`
  # con su porqué.
  secretos:
    name: Sin secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con la historia entera
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks 8.30.1, contra su suma
        run: |
          V=8.30.1
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Ningún secreto en la historia
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .

  verificar:
    name: Tipos, tests y build (Node ${{ matrix.node }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ver `engines` en `package.json`.
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
