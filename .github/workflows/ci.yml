# CI de Óga Veve.
#
# Comprueba tipos, pasa los tests del modelo de vuelo y verifica que el juego
# compila, en cada push a main y en cada pull request. Tarda menos de un
# minuto: si tarda más, deja de mirarse y deja de servir.
#
# Node 20 es el mínimo declarado en `package.json`. Se prueba también en 22
# **en las propuestas**, que es donde una regresión de runtime hay que cazarla:
# después de entrar en main ya es tarde y cuesta el doble.
name: CI

on:
  push:
    branches: [main]
    # Lo que no puede romper una compilación no la dispara. Un cambio en el
    # README encendía cuatro trabajos: dos de CI y dos de despliegue.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]

# **Una tanda por rama, y gana la última.**
#
# El despliegue ya lo hacía y CI no, y eso se ve en el calendario: noventa y
# cuatro tandas en un solo día, doce de septiembre. Se trabaja a ráfagas de
# commits seguidos, así que la mitad de esas tandas estaban comprobando un
# commit que ya no era la punta de la rama cuando terminaron. Lo que importa
# es que la punta esté verde.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **Y que la historia no acredite a ninguna herramienta.**
  #
  # El gancho de `.githooks/commit-msg` ataja esto antes de que el commit
  # exista, que es donde hay que atajarlo. Esto de aquí es el cerrojo de
  # detrás: un `--no-verify`, un clon sin `npm install`, o una reescritura que
  # vuelva a meter lo que se acaba de sacar.
  #
  # Mira la historia **entera** y no solo lo que llega nuevo, a propósito: lo
  # que se quiere garantizar no es que este push venga limpio, es que el
  # repositorio lo esté. Se paga con un clon completo, y por eso este trabajo
  # no instala nada ni compila nada — son unos segundos y va en paralelo con
  # el que sí trabaja.
  atribucion:
    name: Sin acreditar herramientas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con la historia entera
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ningún commit acredita una herramienta
        run: |
          # `--grep` busca en el mensaje entero —asunto y cuerpo— y devuelve
          # **qué commit**, que es lo que hace falta para arreglarlo. Un grep
          # sobre la salida daría el número de línea de un río de texto.
          sucios=$(git log --all --extended-regexp --regexp-ignore-case \
            --grep='(<noreply@anthropic\.com>|^Claude-Session:|^Co-Authored-By:.*\bClaude\b|Generated with \[|claude\.ai/code/)' \
            --format='  %h %s')
          if [ -n "$sucios" ]; then
            echo "✗ Estos commits acreditan una herramienta:"
            echo "$sucios"
            echo ""
            echo "Ver AGENTS.md, apartado «Publicación»."
            exit 1
          fi
          echo "✓ historia limpia"

  verificar:
    name: Tipos, tests y build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # **Las dos versiones en la propuesta, una al entrar.**
        #
        # Probar en 20 y en 22 existe para que una regresión de runtime no
        # aparezca solo en producción, y el sitio donde eso hay que cazarlo es
        # **antes** de entrar, no después. En cada push a main era pagar el
        # doble por enterarse más tarde. Ver `engines` en `package.json`.
        node: ${{ github.event_name == 'pull_request' && fromJSON('["20","22"]') || fromJSON('["22"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
